site:
  title: SKaiNET Transformers
  start_page: skainet-transformers::index.adoc

# Keep Antora's content cache inside the project tree so the container
# can be run as a non-root user (docker run --user $(id -u):$(id -g)).
# Matches mainline SKaiNET's playbook.
runtime:
  cache_dir: ./.cache/antora

antora:
  extensions:
    # SKaiNET site search (dogfooding SKaiNET-rag): indexes the rendered pages
    # at build time (Kotlin/Wasm, in-process — hence Node >= 22 in the image)
    # and publishes _search/search.lrb plus the client-side hybrid engine with
    # the site. The UI bundle below supplies the search box UX; all queries run
    # in the visitor's browser, no search server. Installed in the Docker image
    # from a SKaiNET-rag release tarball.
    - require: '@skainet/antora-site-search'

content:
  sources:
    - url: /antora
      start_path: docs
      branches: HEAD

asciidoc:
  extensions:
    # Local mermaid block processor — renders every `[mermaid]` block
    # inline by invoking the @mermaid-js/mermaid-cli binary baked into
    # the Docker image at /opt/antora/node_modules/.bin/mmdc. Replaces
    # asciidoctor-kroki so builds don't depend on kroki.io at all
    # (no GET-URL length limit, no external server). Same approach as
    # mainline SKaiNET.
    - /opt/antora/local-mermaid-extension.js

ui:
  bundle:
    # SKaiNET-branded UI bundle from the shared skainet-docs-ui repo:
    #   https://github.com/SKaiNET-developers/skainet-docs-ui
    # Pinned to a specific tag for reproducible builds. Bumping
    # this URL to a newer version is a one-line PR. Mainline
    # SKaiNET pins the same bundle in its own playbook.
    url: https://github.com/SKaiNET-developers/skainet-docs-ui/releases/download/v1.2.0/ui-bundle.zip
    snapshot: true

output:
  dir: ./build/site
